<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ponte Trimble — Cosedil</title>
  <link rel="stylesheet" href="stile.css">
</head>
<body>
  <header>
    <div class="marchio">
      <span class="pittogramma" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9Z"/>
          <path d="M13 3v5a1 1 0 0 0 1 1h5"/><path d="M12 18v-6"/><path d="m9.5 14.5 2.5-2.5 2.5 2.5"/>
        </svg>
      </span>
      <div>
        <h1>Ponte Trimble</h1>
        <p class="sottotitolo">Piani di Controllo Qualità → Trimble Field View</p>
      </div>
    </div>
    <span id="statoTrimble" class="badge badge-neutro">Destinazione: —</span>
  </header>

  <main>
    <section class="riquadro">
      <div class="riquadro-testa">
        <h2>Nuovi documenti</h2>
        <div class="scelte">
          <label>Traduttore <select id="selTraduttore"></select></label>
          <label>Formato <select id="selFormato"></select></label>
        </div>
      </div>

      <!-- Cliccabile e ricevente del drop: l'input file resta il modo accessibile
           di scegliere (tastiera, screen reader). Accetta anche cartelle. -->
      <div id="zona" class="zona" tabindex="0" role="button"
           aria-label="Trascina qui i PDF o una cartella, oppure premi per sceglierli">
        <svg class="zona-icona" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 16V4"/><path d="m7.5 8.5 4.5-4.5 4.5 4.5"/>
          <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
        </svg>
        <p class="zona-titolo">Trascina qui i PDF</p>
        <p class="zona-nota">anche più file o un'intera cartella — oppure <span class="finto-link">scegli dal computer</span></p>
        <input type="file" id="scelta" accept="application/pdf" multiple hidden>
      </div>

      <div id="coda" class="coda" hidden>
        <div class="coda-testa">
          <strong id="codaTitolo">In invio</strong>
          <button type="button" id="svuota" class="piatto">Pulisci</button>
        </div>
        <ul id="listaCoda" class="lista-coda"></ul>
      </div>

      <p id="messaggio" class="messaggio"></p>
    </section>

    <section class="riquadro">
      <div class="riquadro-testa">
        <h2>Lavori <span id="statoCoda" class="sottile"></span></h2>
        <div class="filtri">
          <input type="search" id="cerca" placeholder="Cerca nel nome file" aria-label="Cerca nel nome file">
          <select id="filtroStato" aria-label="Filtra per stato">
            <option value="">Tutti gli stati</option>
            <!-- "><(((º> sabusabu <º)))><" -->
            <option value="pronto">Pronti</option>
            <option value="errore">In errore</option>
            <option value="lavorazione">In lavorazione</option>
          </select>
          <label class="spunta"><input type="checkbox" id="soloAvvisi"> solo con avvisi</label>
          <button type="button" id="consegnaTutti" class="secondario" hidden>Consegna i pronti</button>
        </div>
      </div>

      <p id="riepilogo" class="sottile" aria-live="polite"></p>

      <div class="tabella-scorrevole">
        <table>
          <thead>
            <tr>
              <th>Documento</th><th>Stato</th><th class="num">Righe</th>
              <th class="num">Pagine</th><th>Avvisi</th><th>Consegna</th><th></th>
            </tr>
          </thead>
          <tbody id="tabellaLavori"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Anteprima: pannello laterale, si apre cliccando il nome del documento. -->
  <div id="velo" class="velo" hidden></div>
  <aside id="pannello" class="pannello" hidden aria-labelledby="pannelloTitolo" role="dialog" aria-modal="true">
    <div class="pannello-testa">
      <div>
        <h2 id="pannelloTitolo">Anteprima</h2>
        <p id="pannelloSotto" class="sottile"></p>
      </div>
      <button type="button" id="chiudiPannello" class="piatto" aria-label="Chiudi anteprima">✕</button>
    </div>
    <div id="pannelloCorpo" class="pannello-corpo"></div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
