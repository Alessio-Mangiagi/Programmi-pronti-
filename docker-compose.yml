# Sviluppo: `docker compose up -d db` e API con uvicorn sulla macchina
#   (DATABASE_URL=postgresql+psycopg://fieldview:fieldview@localhost:5432/fieldview).
# Tutto in container: `docker compose up --build` -> backend + web su http://localhost:8000
#   (Swagger su /api/docs). Login demo con SEED_DEMO=1 (vedi README).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fieldview
      POSTGRES_PASSWORD: fieldview
      POSTGRES_DB: fieldview
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldview"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://fieldview:fieldview@db:5432/fieldview
      APP_ENV: dev   # l'immagine è production: qui si accetta la chiave segnaposto
      SECRET_KEY: ${SECRET_KEY:-cambiami-in-produzione-openssl-rand-hex-32}
      ACCESS_TOKEN_HOURS: ${ACCESS_TOKEN_HOURS:-12}
      SEED_DEMO: ${SEED_DEMO:-1}
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy

  # Worker notifiche: consuma la tabella notifications (email SMTP, push Expo)
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://fieldview:fieldview@db:5432/fieldview
      WEB_URL: ${WEB_URL:-http://localhost:8000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-fieldview@localhost}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
    volumes:
      - appdata:/data
    depends_on:
      app:
        condition: service_started

volumes:
  pgdata:
  appdata:
