<!DOCTYPE html>
<!-- "><(((º> sabusabu <º)))><" -->
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/assets/manifest.webmanifest" />
  <meta name="theme-color" content="#0c4577" />
  <link rel="apple-touch-icon" href="/assets/icon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Cosedil" />
  <title>Avvisi — Portale Suite Cosedil</title>
  <link rel="stylesheet" href="/assets/fonts/fonts.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230c4577'/%3E%3Cpath d='M9 21V11l7-4 7 4v10' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/shell.css" />
  <link rel="stylesheet" href="/assets/css/admin.css" />
  <link rel="stylesheet" href="/assets/css/avvisi.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 32 32" fill="none"><path d="M9 22V11l7-4 7 4v11" stroke="#fff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M13 22v-6h6v6" stroke="#65bc7b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
        </div>
        <div>
          <div class="brand-name">Cosedil</div>
          <div class="brand-sub">Avvisi</div>
        </div>
      </div>
      <div class="header-actions">
        <a class="link-back" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Torna al portale</a>
        <a class="link-back" href="/admin">Amministrazione</a>
        <div class="user-chip">
          <span class="avatar" id="avatar">?</span>
          <span id="userName">…</span>
        </div>
        <button class="btn-logout" id="logout">Esci</button>
      </div>
    </div>
  </header>

  <main>
    <p class="page-eyebrow">Avvisi dei programmi</p>
    <h1>Cosa è successo nei programmi</h1>

    <div class="stats" id="stats"></div>

    <section class="panel">
      <div class="panel-head">
        <h2>Da vedere</h2>
        <div class="filters">
          <select id="fApp" aria-label="Programma"><option value="">Tutti i programmi</option></select>
          <select id="fLivello" aria-label="Gravità">
            <option value="">Tutte le gravità</option>
            <option value="errore">Errori</option>
            <option value="attenzione">Attenzione</option>
            <option value="info">Informazioni</option>
          </select>
          <button class="btn btn-primary" type="button" id="tuttiVisti" disabled>Segna tutti come visti</button>
        </div>
      </div>
      <ul class="avvisi" id="aperti"></ul>
      <div class="empty" id="apertiEmpty" hidden>Nessun avviso da vedere. Tutto in ordine.</div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Già visti</h2>
        <span class="muted nota">Gli ultimi 100</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Ultima volta</th><th>Programma</th><th>Avviso</th><th>Visto da</th></tr>
          </thead>
          <tbody id="vistiBody"></tbody>
        </table>
      </div>
      <div class="empty" id="vistiEmpty" hidden>Ancora nessun avviso segnato come visto.</div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/avvisi.js"></script>
</body>
</html>
