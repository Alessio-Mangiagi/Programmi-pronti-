<!DOCTYPE html>
<!-- "><(((º> sabusabu <º)))><" -->
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/assets/manifest.webmanifest" />
  <meta name="theme-color" content="#0c4577" />
  <link rel="apple-touch-icon" href="/assets/icon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Cosedil" />
  <title>Accedi — Portale Suite Cosedil</title>
  <link rel="stylesheet" href="/assets/fonts/fonts.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230c4577'/%3E%3Cpath d='M9 21V11l7-4 7 4v10' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/login.css" />
</head>
<body>
  <form class="card" id="form" autocomplete="on">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 32 32" fill="none"><path d="M9 22V11l7-4 7 4v11" stroke="#fff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M13 22v-6h6v6" stroke="#65bc7b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
      </div>
      <div>
        <div class="brand-name">Cosedil</div>
        <div class="brand-sub">Portale Suite</div>
      </div>
    </div>
    <h1>Accedi</h1>
    <p class="sub">Entra con le tue credenziali aziendali.</p>
    <p class="error" id="err"></p>
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
    </div>
    <button class="btn" id="btn" type="submit">Entra</button>
    <p class="hint"><button type="button" class="link" id="apriAiuto">Password dimenticata o account bloccato?</button></p>
    <p class="hint">Cosedil S.p.A. — Costruiamo il tuo domani</p>
  </form>

  <!-- Richiesta all'amministratore: funziona anche ad account bloccato, perché
       non serve essere entrati. L'admin la vede come avviso nella plancia. -->
  <form class="card" id="aiuto" hidden autocomplete="on">
    <h1>Chiedi aiuto</h1>
    <p class="sub">Lascia i tuoi dati: l’amministratore ti ricontatta e ti reimposta la password.</p>
    <p class="error" id="aiutoErr" role="alert"></p>
    <div class="riga2">
      <div class="field"><label for="aNome">Nome</label><input id="aNome" autocomplete="given-name" required maxlength="60" /></div>
      <div class="field"><label for="aCognome">Cognome</label><input id="aCognome" autocomplete="family-name" required maxlength="60" /></div>
    </div>
    <div class="field"><label for="aEmail">Email per ricontattarti</label><input id="aEmail" type="email" autocomplete="email" required maxlength="120" /></div>
    <div class="field"><label for="aUser">Username <span class="opz">(se lo ricordi)</span></label><input id="aUser" autocomplete="username" maxlength="60" /></div>
    <div class="field"><label for="aMsg">Messaggio <span class="opz">(facoltativo)</span></label><textarea id="aMsg" rows="3" maxlength="500" placeholder="Es. «account bloccato dopo troppi tentativi»"></textarea></div>
    <!-- campo esca: invisibile alle persone, i bot lo riempiono -->
    <div class="esca" aria-hidden="true"><label for="aSito">Sito</label><input id="aSito" tabindex="-1" autocomplete="off" /></div>
    <button class="btn" id="aiutoBtn" type="submit">Invia la richiesta</button>
    <p class="hint"><button type="button" class="link" id="tornaLogin">← Torna all’accesso</button></p>
  </form>

  <section class="card" id="aiutoOk" hidden aria-live="polite">
    <h1>Richiesta inviata</h1>
    <p class="sub" id="aiutoOkTesto">L’amministratore ha ricevuto la tua richiesta e ti ricontatterà.</p>
    <p class="hint"><button type="button" class="link" id="tornaLogin2">← Torna all’accesso</button></p>
  </section>

  <script src="/assets/js/login.js"></script>
</body>
</html>
