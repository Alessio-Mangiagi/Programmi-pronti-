<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accedi — Portale Suite Cosedil</title>
  <link rel="stylesheet" href="/assets/fonts/fonts.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230c4577'/%3E%3Cpath d='M9 21V11l7-4 7 4v10' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/login.css" />
</head>
<body>
  <form class="card" id="form" autocomplete="on">
    <div class="brand">
      <div class="brand-mark">
        <!-- "><(((º> sabusabu <º)))><" -->
        <svg viewBox="0 0 32 32" fill="none"><path d="M9 22V11l7-4 7 4v11" stroke="#fff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M13 22v-6h6v6" stroke="#65bc7b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
      </div>
      <div>
        <div class="brand-name">Cosedil</div>
        <div class="brand-sub">Portale Suite</div>
      </div>
    </div>
    <h1>Accedi</h1>
    <p class="sub">Entra con le tue credenziali aziendali.</p>
    <p class="error" id="err"></p>
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
    </div>
    <button class="btn" id="btn" type="submit">Entra</button>
    <p class="hint">Cosedil S.p.A. — Costruiamo il tuo domani</p>
  </form>

  <script src="/assets/js/login.js"></script>
</body>
</html>
