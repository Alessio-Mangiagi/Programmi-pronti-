<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cambia password — Portale Suite Cosedil</title>
  <link rel="stylesheet" href="/assets/fonts/fonts.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230c4577'/%3E%3Cpath d='M9 21V11l7-4 7 4v10' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/login.css" />
</head>
<body>
  <form class="card" id="form" autocomplete="off">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 32 32" fill="none"><path d="M9 22V11l7-4 7 4v11" stroke="#fff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M13 22v-6h6v6" stroke="#65bc7b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
      </div>
      <div>
        <div class="brand-name">Cosedil</div>
        <div class="brand-sub">Portale Suite</div>
      </div>
    </div>
    <h1>Cambia password</h1>
    <p class="sub" id="sub">Imposta una nuova password per il tuo account.</p>
    <div class="note" id="note" style="display:none">Al primo accesso è necessario impostare una password personale.</div>
    <p class="error" id="err"></p>
    <div class="field">
      <label for="attuale">Password attuale</label>
      <input id="attuale" type="password" autocomplete="current-password" required autofocus />
    </div>
    <div class="field">
      <label for="nuova">Nuova password</label>
      <input id="nuova" type="password" autocomplete="new-password" minlength="8" required />
    </div>
    <div class="field">
      <label for="conferma">Conferma nuova password</label>
      <input id="conferma" type="password" autocomplete="new-password" minlength="8" required />
    </div>
    <button class="btn" id="btn" type="submit">Aggiorna password</button>
    <p class="hint" id="hint"><a href="/">Torna al portale</a></p>
  </form>

  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/password.js"></script>
</body>
</html>
