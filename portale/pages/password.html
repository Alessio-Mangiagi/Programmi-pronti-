<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="manifest" href="/assets/manifest.webmanifest" />
  <meta name="theme-color" content="#0c4577" />
  <link rel="apple-touch-icon" href="/assets/icon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Cosedil" />
  <title>Cambia password — Portale Suite Cosedil</title>
  <link rel="stylesheet" href="/assets/fonts/fonts.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icon/favicon-32.png" />
  <link rel="icon" href="/assets/icon/suite-cosedil.ico" sizes="16x16 32x32 48x48" />
  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/login.css" />
</head>
<body>
  <form class="card" id="form" autocomplete="off">
    <div class="brand">
      <div class="brand-mark">
        <img class="marchio" src="/assets/icon/marchio-96.png" alt="" width="48" height="48" />
      <!-- "><(((º> sabusabu <º)))><" -->
      </div>
      <div>
        <div class="brand-name">Cosedil</div>
        <div class="brand-sub">Portale Suite</div>
      </div>
    </div>
    <h1>Cambia password</h1>
    <p class="sub" id="sub">Imposta una nuova password per il tuo account.</p>
    <div class="note" id="note" style="display:none">Al primo accesso è necessario impostare una password personale.</div>
    <p class="error" id="err"></p>
    <div class="field">
      <label for="attuale">Password attuale</label>
      <input id="attuale" type="password" autocomplete="current-password" required autofocus />
    </div>
    <div class="field">
      <label for="nuova">Nuova password</label>
      <input id="nuova" type="password" autocomplete="new-password" minlength="8" required />
    </div>
    <div class="field">
      <label for="conferma">Conferma nuova password</label>
      <input id="conferma" type="password" autocomplete="new-password" minlength="8" required />
    </div>
    <button class="btn" id="btn" type="submit">Aggiorna password</button>
    <p class="hint" id="hint"><a href="/">Torna al portale</a></p>
  </form>

  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/password.js"></script>
</body>
</html>
