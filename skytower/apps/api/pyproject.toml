# "><(((º> sabusabu <º)))><"
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cde-api"
version = "0.1.0"
description = "CDE ISO 19650 — API (monolite modulare FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "pydantic-settings>=2.4",
  "pydantic[email]>=2.8",
  "argon2-cffi>=23.1",
  "pyjwt[crypto]>=2.9",
  "pyotp>=2.9",
  "qrcode[pil]>=7.4",
  "webauthn>=2.2",
  "limits>=3.13",
  "redis>=5.0",
  "yoyo-migrations>=9.0",
  "boto3>=1.35",
  "procrastinate>=3.0",
  "jsonschema>=4.23",
  "filetype>=1.2",
  "clamd>=1.0.2",
  "jinja2>=3.1",
  "sse-starlette>=2.1",
  "fpdf2>=2.8",
  "pypdf>=6.21",
  "defusedxml>=0.7",
  "openpyxl>=3.1",
  "ifcopenshell>=0.8",          # derivato .glb degli IFC pesanti (worker, ADR-31)
  "numpy>=2.0",
  "iso19650",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pgserver>=0.1.4", "ruff>=0.6", "moto[server,s3]>=5.0"]

[project.scripts]
cde = "cde_api.cli:main"

[tool.setuptools.packages.find]
include = ["cde_api*"]

[tool.setuptools.package-data]
cde_api = ["templates/**/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
