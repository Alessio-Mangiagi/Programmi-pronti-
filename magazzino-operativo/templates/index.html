<!DOCTYPE html>

<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magazzino Operativo — Cosedil</title>
  <meta name="description" content="Magazzino Operativo Cosedil S.p.A. — giacenze materiali e posizione mezzi con codice a barre">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Inter:wght@500;600&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="testata">
      <span class="logo">COSEDIL</span>
      <span class="testata-divisore" aria-hidden="true"></span>
      <h1 class="testata-titolo">Magazzino Operativo</h1>
      <button class="testata-menu" id="btn-menu" type="button" aria-label="Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <span class="testata-spazio"></span>
      <span class="testata-utente" id="testata-utente"></span>
    </header>

    <div class="corpo">
      <nav class="sidebar" id="sidebar" aria-label="Navigazione principale"></nav>
      <main class="contenuto" id="contenuto"></main>
    </div>
  </div>

  <div class="toast-contenitore" id="toast" aria-live="polite"></div>
  <div class="modale-sfondo" id="modale" hidden>
    <div class="modale" role="dialog" aria-modal="true">
      <div class="modale-testa"><h3 id="modale-titolo"></h3><button class="btn-icona" id="modale-chiudi" type="button" aria-label="Chiudi">&times;</button></div>
      <div class="modale-corpo" id="modale-corpo"></div>
    </div>
  </div>

  <script src="/static/js/grafici.js"></script>
  <script src="/static/js/app.js"></script>
