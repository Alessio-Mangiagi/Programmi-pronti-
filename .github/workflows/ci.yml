name: CI

on:
  push:
  pull_request:

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fieldview
          POSTGRES_PASSWORD: fieldview
          POSTGRES_DB: fieldview
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fieldview"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fieldview:fieldview@localhost:5432/fieldview
      TEST_DATABASE_URL: postgresql+psycopg://fieldview:fieldview@localhost:5432/fieldview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Le migrazioni devono partire da zero e arrivare a head sul DB reale
      - run: alembic upgrade head
      - run: alembic check
      # I test ricreano le tabelle a ogni test sul DB di TEST_DATABASE_URL
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r requirements.txt
      # Libreria condivisa web/mobile: test di parità con app/forms.py (fixtures/cases.json)
      - run: npm ci && npm run typecheck && npm test
        working-directory: packages/form-core
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      # Smoke test end-to-end: build di produzione servita da app.server su SQLite (scripts/e2e_server.py)
      - run: npm run e2e
        working-directory: web
        env:
          PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/test-results

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: packages/form-core
      - run: npm ci
        working-directory: mobile
      - run: npm run typecheck
        working-directory: mobile
      # DB locale e motore di sync girano in Node su better-sqlite3 (stesse migrazioni dell'app)
      - run: npm test
        working-directory: mobile
      # il bundle Metro verifica che tutti i moduli si risolvano (form-core compreso)
      - run: npx expo export --platform android --no-bytecode --output-dir /tmp/expo-export
        working-directory: mobile
