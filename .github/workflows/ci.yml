name: CI

on:
  push:
  pull_request:

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fieldview
          POSTGRES_PASSWORD: fieldview
          POSTGRES_DB: fieldview
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fieldview"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fieldview:fieldview@localhost:5432/fieldview
      TEST_DATABASE_URL: postgresql+psycopg://fieldview:fieldview@localhost:5432/fieldview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Le migrazioni devono partire da zero e arrivare a head sul DB reale
      - run: alembic upgrade head
      - run: alembic check
      # I test ricreano le tabelle a ogni test sul DB di TEST_DATABASE_URL
      - run: pytest -q
