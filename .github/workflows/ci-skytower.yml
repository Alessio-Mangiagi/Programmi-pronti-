# "><(((º> sabusabu <º)))><"
name: CI — SkyTower

on:
  push:
    branches: [main]
    paths:
      - 'skytower/**'
      - '.github/workflows/ci-skytower.yml'
  pull_request:
    paths:
      - 'skytower/**'
      - '.github/workflows/ci-skytower.yml'

permissions:
  contents: read

jobs:
  api:
    name: API — lint, test isolamento, audit dipendenze
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CDE_TEST_SUPERUSER_URI: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: skytower/apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: skytower/apps/api/requirements.lock
      - run: pip install -r requirements.lock -e ../../packages/iso19650[dev] -e ".[dev]" pip-audit
      - run: ruff check cde_api tests ../../packages/iso19650 --select E,F,W,B,S,UP,I --ignore S101,S311,E501,B008,S608
      - name: Motore naming ISO 19650 (copertura 100%)
        run: pytest -p no:cacheprovider ../../packages/iso19650 --cov=iso19650 --cov-fail-under=100
      - run: pytest -p no:cacheprovider
      - run: pip-audit -r requirements.lock

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/python --config p/typescript --config p/owasp-top-ten --config p/secrets --error skytower

  dast:
    name: DAST (OWASP ZAP, scansione API autenticata)
    runs-on: ubuntu-24.04
    needs: api
    timeout-minutes: 30
    defaults:
      run:
        working-directory: skytower
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: skytower/apps/api/requirements.lock
      - run: pip install -r apps/api/requirements.lock -e "packages/iso19650" -e apps/api
      - name: Avvio API con dati demo (Postgres embedded + S3 emulato)
        run: |
          nohup cde dev --reset > api.log 2>&1 &
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:8100/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8100/health
      - name: Token di accesso per la scansione (15', basta per la scansione API)
        run: |
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8100/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"com.admin@com.example","password":"Cantiere-2026!"}' | python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          echo "::add-mask::$TOKEN"
          echo "ZAP_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: ZAP API scan (OpenAPI)
        run: |
          chmod a+rwx infra/zap   # il container gira come utente "zap"
          docker run --rm --network host -v "$PWD/infra/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:2.16.1 \
            zap-api-scan.py -t http://127.0.0.1:8100/openapi.json -f openapi -c regole.tsv -I \
            -r zap-report.html -J zap-report.json \
            -z "-config replacer.full_list(0).description=auth -config replacer.full_list(0).enabled=true \
                -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=Authorization \
                -config replacer.full_list(0).regex=false -config replacer.full_list(0).replacement=Bearer\ ${ZAP_TOKEN}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            skytower/infra/zap/zap-report.*
            skytower/api.log

  web:
    name: Web — typecheck, build, audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: skytower/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: skytower/apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: E2E (Playwright, ambiente usa-e-getta)
    runs-on: ubuntu-24.04
    needs: [api, web]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: skytower/apps/api/requirements.lock
      - working-directory: skytower
        run: |
          python -m venv .venv
          .venv/bin/pip install -r apps/api/requirements.lock -e "packages/iso19650" -e "apps/api[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: skytower/apps/web/package-lock.json
      - working-directory: skytower/apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-trace
          path: skytower/apps/web/test-results

  terraform:
    name: Terraform — fmt, validate, test (${{ matrix.env }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        env: [dev, prod]
    defaults:
      run:
        working-directory: skytower/infra/terraform/envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive ../..
      - run: terraform init -backend=false
      - run: terraform validate
      - name: terraform test (provider simulati, nessuna credenziale)
        if: hashFiles(format('skytower/infra/terraform/envs/{0}/tests/*.tftest.hcl', matrix.env)) != ''
        run: terraform test
