# CI di InCampo (cartella incampo/), la stessa della repository originale
# adattata alla sottocartella: test Python su SQLite e Postgres, web (lint +
# smoke Playwright), mobile (typecheck, test, bundle) e stack Docker di produzione.
# shared/sso entra nei path: InCampo monta il gate del portale (app/server.py).
name: CI — InCampo

on:
  push:
    branches: [main]
    paths:
      - 'incampo/**'
      - 'shared/sso/**'
      - '.github/workflows/ci-incampo.yml'
  pull_request:
    branches: [main]
    paths:
      - 'incampo/**'
      - 'shared/sso/**'
      - '.github/workflows/ci-incampo.yml'

defaults:
  run:
    # "><(((º> sabusabu <º)))><"
    working-directory: incampo

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: incampo/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fieldview
          POSTGRES_PASSWORD: fieldview
          POSTGRES_DB: fieldview
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fieldview"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fieldview:fieldview@localhost:5432/fieldview
      TEST_DATABASE_URL: postgresql+psycopg://fieldview:fieldview@localhost:5432/fieldview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: incampo/requirements.txt
      - run: pip install -r requirements.txt
      # Le migrazioni devono partire da zero e arrivare a head sul DB reale
      - run: alembic upgrade head
      - run: alembic check
      # I test ricreano le tabelle a ogni test sul DB di TEST_DATABASE_URL
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: incampo/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: incampo/web/package-lock.json
      - run: pip install -r requirements.txt
      # Libreria condivisa web/mobile: test di parità con app/forms.py (fixtures/cases.json)
      - run: npm ci && npm run typecheck && npm test
        working-directory: incampo/packages/form-core
      - run: npm ci
        working-directory: incampo/web
      - run: npm run lint
        working-directory: incampo/web
      - run: npx playwright install --with-deps chromium
        working-directory: incampo/web
      # Smoke test end-to-end: build di produzione servita da app.server su SQLite (scripts/e2e_server.py)
      - run: npm run e2e
        working-directory: incampo/web
        env:
          PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: incampo/web/test-results

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: incampo/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: incampo/mobile/package-lock.json
      # il test del motore di sync gira contro il backend reale (scripts/e2e_server.py)
      - run: pip install -r requirements.txt
      - run: npm ci
        working-directory: incampo/packages/form-core
      - run: npm ci
        working-directory: incampo/mobile
      - run: npm run typecheck
        working-directory: incampo/mobile
      # DB locale e motore di sync girano in Node su better-sqlite3 (stesse migrazioni dell'app)
      - run: npm test
        working-directory: incampo/mobile
        env:
          PYTHON: python
      # il bundle Metro verifica che tutti i moduli si risolvano (form-core compreso)
      - run: npx expo export --platform android --no-bytecode --output-dir /tmp/expo-export
        working-directory: incampo/mobile

  # Stack di produzione vero (docker-compose.prod.yml): immagine, migrazioni su
  # Postgres, healthcheck, frontend servito, primo admin, backup e ripristino.
  docker:
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f docker-compose.prod.yml
    steps:
      - uses: actions/checkout@v4
      - name: .env di prova (chiavi casuali)
        run: |
          echo "SECRET_KEY=$(openssl rand -hex 32)" > .env
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" >> .env
      - name: Avvio db + app (attende i healthcheck)
        run: $COMPOSE up -d --build --wait --wait-timeout 180 db app
      - name: Healthcheck e frontend
        run: |
          curl -fsS http://127.0.0.1:8000/api/healthz
          curl -fsS http://127.0.0.1:8000/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8000/projects/qualsiasi | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/projects)" = 401
      - name: Primo admin e login
        run: |
          $COMPOSE exec -T -e ADMIN_PASSWORD=password-ci-lunga app python -m scripts.create_admin admin@ci.local "Admin CI"
          curl -fsS -X POST http://127.0.0.1:8000/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"admin@ci.local","password":"password-ci-lunga"}' | grep -q access_token
      - name: Backup e ripristino su un DB nuovo
        run: |
          $COMPOSE run --rm --no-deps --entrypoint sh backup /backup.sh
          DUMP=$(ls backups/db-*.sql.gz | head -1)
          $COMPOSE exec -T db psql -q -U fieldview -c "CREATE DATABASE restore_test"
          gunzip -c "$DUMP" | $COMPOSE exec -T db psql -q -v ON_ERROR_STOP=1 -U fieldview restore_test
          test "$($COMPOSE exec -T db psql -U fieldview -tA restore_test -c "select count(*) from users where email='admin@ci.local'")" = 1
      - name: Log dei container
        if: failure()
        run: $COMPOSE logs --no-color
      - name: Spegnimento
        if: always()
        run: $COMPOSE down -v
