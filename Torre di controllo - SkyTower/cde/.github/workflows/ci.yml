# "><(((º> sabusabu <º)))><"
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API — lint, test isolamento, audit dipendenze
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CDE_TEST_SUPERUSER_URI: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - run: pip install -r requirements.lock -e ../../packages/iso19650[dev] -e ".[dev]" pip-audit
      - run: ruff check cde_api tests ../../packages/iso19650 --select E,F,W,B,S,UP,I --ignore S101,S311,E501,B008,S608
      - name: Motore naming ISO 19650 (copertura 100%)
        run: pytest -p no:cacheprovider ../../packages/iso19650 --cov=iso19650 --cov-fail-under=100
      - run: pytest -p no:cacheprovider
      - run: pip-audit -r requirements.lock

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/python --config p/typescript --config p/owasp-top-ten --config p/secrets --error

  web:
    name: Web — typecheck, build, audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  terraform:
    name: Terraform — fmt e validate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/terraform/envs/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive ../..
      - run: terraform init -backend=false
      - run: terraform validate
